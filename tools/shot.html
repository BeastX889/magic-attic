<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%}</style>
<iframe id="f"></iframe>
<script>
// shot.html?level=N&find=K|win|lose[&zoom=Z&zx=X&zy=Y][&hint=1]  — store screenshots
const q = new URLSearchParams(location.search);
const f = document.getElementById('f');
localStorage.removeItem('lumio-hidden-attic-v1');
f.src = '../index.html?level=' + (q.get('level') || 1);
f.onload = () => setTimeout(() => {
  const h = f.contentWindow.__ha, mv = q.get('find') || '0';
  const n = mv === 'win' ? 99 : mv === 'lose' ? 2 : +mv;
  if (q.get('mouse')) { const m = h.G.items.find(i => i.gold); h.tap(m.x, m.y); }
  h.findN(n);
  if (mv === 'lose') h.G.timeLeft = 0.01;
  if (q.get('zoom')) { const z = +q.get('zoom'); Object.assign(h.cam, { z, x: +q.get('zx') || 0, y: +q.get('zy') || 0 }); Object.assign(h.camT, h.cam); }
  if (mv !== 'win') { h.settle(); setTimeout(() => h.settle(), 300); }
  else setTimeout(() => h.settle(), 1200);   // clear combo texts + intro banner once the win popup is up
}, +(q.get('wait') || 1500));
</script>
