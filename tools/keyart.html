<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#1f1440;overflow:hidden}canvas{display:block}</style>
</head><body><canvas id="c"></canvas>
<script type="module">
// Key art renderer: keyart.html?w=1920&h=1080&title=1
import { itemSprite, customerSprite, sparkle, circle, lg, rg, star, rrect } from '../src/art.js';
import { drawObject } from '../src/objects.js';
import { composeRoom, roomCanvas } from '../src/rooms.js';

const q = new URLSearchParams(location.search);
const W = +q.get('w') || 1920, H = +q.get('h') || 1080, TITLE = q.get('title') !== '0';
const cv = document.getElementById('c');
cv.width = W; cv.height = H;
const g = cv.getContext('2d');
const FONT = '"Arial Rounded MT Bold","Baloo 2","Trebuchet MS",system-ui,sans-serif';
const OUT = '#2b1a3d';

// seeded random so every size gets the same sky
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

function sky() {
  g.fillStyle = lg(g, 0, 0, 0, H, [[0, '#1f1440'], [0.5, '#3d2468'], [1, '#6a3478']]);
  g.fillRect(0, 0, W, H);
  const u = Math.min(W, H);
  for (let i = 0; i < 140; i++) {
    g.globalAlpha = 0.3 + rnd() * 0.7;
    sparkle(g, rnd() * W, rnd() * H * 0.8, (1 + rnd() * 2.5) * u / 400, '#fff6dc');
  }
  g.globalAlpha = 1;
}
// the furnished attic from the game, softened, so the cover shows where the hunt happens
function roomBg() {
  const ar = W / H, sw = ar > 1.2 ? 1300 : ar > 0.85 ? 900 : 700, sh = Math.round(sw * H / W);
  const R = composeRoom('attic', sw, sh, 0), res = W / sw;
  g.filter = 'blur(3px)'; g.drawImage(roomCanvas(R, 'back', res), 0, 0, W, H); g.filter = 'none';
  g.drawImage(roomCanvas(R, 'front', res), 0, 0, W, H);
  g.fillStyle = 'rgba(28,14,56,0.5)'; g.fillRect(0, 0, W, H);
  g.fillStyle = rg(g, W / 2, H / 2, Math.min(W, H) * 0.3, Math.hypot(W, H) * 0.6, [[0, 'rgba(20,10,40,0)'], [1, 'rgba(20,10,40,0.55)']]); g.fillRect(0, 0, W, H);
}
function moon(x, y, r) {
  g.fillStyle = rg(g, x, y, r * 0.2, r * 3, [[0, 'rgba(255,240,200,0.45)'], [1, 'rgba(255,240,200,0)']]);
  g.fillRect(x - r * 3, y - r * 3, r * 6, r * 6);
  circle(g, x, y, r); g.fillStyle = '#fff3cf'; g.fill();
  circle(g, x - r * 0.3, y - r * 0.2, r * 0.18); g.fillStyle = 'rgba(220,200,160,0.5)'; g.fill();
  circle(g, x + r * 0.28, y + r * 0.3, r * 0.12); g.fill();
}
function put(spr, x, y, s, rot = 0) {
  g.save(); g.translate(x, y); g.rotate(rot); g.drawImage(spr, -s / 2, -s / 2, s, s); g.restore();
}
const item = (c, t, s) => itemSprite(c, t, Math.ceil(s));

// The scene: a heap of attic treasures, a giant magnifying glass revealing the golden mouse.
const OBJS = ['key','feather','candle','book','teacup','watch','scroll','ring','hat','broom','lantern','apple','cheese','bell','dice','umbrella','sock','glasses','shell','acorn','letter','yarn','crown','cookie','lollipop','fish','cupcake','boot','carrot','pumpkin','duck','brush','balloon','butterfly','bow'];
const MAG = [['potion',5],['potion',6],['crys',8],['herb',7],['mush',6],['crys',6],['potion',8],['herb',3]];
function objSpr(name, s) { const n = Math.ceil(s); const c = document.createElement('canvas'); c.width = c.height = n; drawObject(c.getContext('2d'), n, name); return c; }
function heap(S) {   // returns a canvas covering the scene box (1.8S x 1.5S)
  const w = Math.ceil(S * 1.8), h = Math.ceil(S * 1.5);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const hg = c.getContext('2d');
  seed = 99;
  const list = [];
  for (let i = 0; i < 120; i++) {
    const a = rnd() * Math.PI * 2, r = Math.sqrt(rnd());
    const x = w / 2 + Math.cos(a) * r * w * 0.44, y = h * 0.58 + Math.sin(a) * r * h * 0.38;
    list.push({ x, y, s: S * (0.16 + rnd() * 0.08), rot: (rnd() - 0.5) * 1.4, k: i, z: y + rnd() * S * 0.2 });
  }
  list.sort((p, q) => p.z - q.z);
  for (const p of list) {
    const spr = p.k % 4 === 3 ? itemSprite(MAG[(p.k >> 2) % MAG.length][0], MAG[(p.k >> 2) % MAG.length][1], Math.ceil(p.s)) : objSpr(OBJS[(p.k * 11) % OBJS.length], p.s);
    hg.save(); hg.translate(p.x, p.y); hg.rotate(p.rot);
    hg.globalAlpha = 0.35; hg.filter = 'brightness(0)'; hg.drawImage(spr, -p.s / 2 + S * 0.01, -p.s / 2 + S * 0.015, p.s, p.s);
    hg.filter = 'none'; hg.globalAlpha = 1; hg.drawImage(spr, -p.s / 2, -p.s / 2, p.s, p.s); hg.restore();
  }
  return c;
}
function scene(cx, cy, S) {
  const x0 = cx - S * 0.9, y0 = cy - S * 0.82;
  // round attic window glow behind the heap
  g.fillStyle = rg(g, cx, cy - S * 0.35, S * 0.05, S * 0.9, [[0, 'rgba(255,230,160,0.4)'], [1, 'rgba(255,230,160,0)']]);
  g.fillRect(cx - S, cy - S * 1.3, S * 2, S * 2);
  const H0 = heap(S);
  g.drawImage(H0, x0, y0);
  // magnifier
  const lx = cx + S * 0.08, ly = cy + S * 0.0, lr = S * 0.34, zoom = 1.75;
  g.save(); g.translate(lx + lr * 0.62, ly + lr * 0.62); g.rotate(-Math.PI / 4);
  rrect(g, -S * 0.055, lr * 0.25, S * 0.11, S * 0.52, S * 0.05);
  g.fillStyle = lg(g, -S * 0.06, 0, S * 0.06, 0, [[0, '#d88a4a'], [1, '#8a4a20']]); g.fill(); g.lineWidth = S * 0.016; g.strokeStyle = OUT; g.stroke();
  g.restore();
  g.save(); circle(g, lx, ly, lr); g.clip();
  g.fillStyle = '#3a2456'; g.fillRect(lx - lr, ly - lr, lr * 2, lr * 2);
  g.translate(lx, ly); g.scale(zoom, zoom); g.translate(-lx, -ly);
  g.drawImage(H0, x0, y0);
  g.restore();
  g.save(); circle(g, lx, ly, lr); g.clip();
  g.fillStyle = rg(g, lx, ly + lr * 0.1, lr * 0.05, lr * 0.75, [[0, 'rgba(255,240,150,0.9)'], [1, 'rgba(255,240,150,0)']]); g.fillRect(lx - lr, ly - lr, lr * 2, lr * 2);
  put(objSpr('mouse', S * 0.42), lx, ly + lr * 0.08, S * 0.42, -0.1);
  g.fillStyle = 'rgba(255,255,255,0.18)'; g.beginPath(); g.ellipse(lx - lr * 0.35, ly - lr * 0.4, lr * 0.45, lr * 0.2, -0.6, 0, Math.PI * 2); g.fill();
  g.restore();
  circle(g, lx, ly, lr); g.lineWidth = S * 0.075; g.strokeStyle = OUT; g.stroke();
  g.lineWidth = S * 0.045; g.strokeStyle = lg(g, lx - lr, ly - lr, lx + lr, ly + lr, [[0, '#fff1a0'], [0.5, '#e0a020'], [1, '#a8661a']]); g.stroke();
  for (let k = 0; k < 10; k++) { const a = rnd() * Math.PI * 2, r = lr * (1.05 + rnd() * 0.35); sparkle(g, lx + Math.cos(a) * r, ly + Math.sin(a) * r, S * (0.015 + rnd() * 0.025), rnd() < 0.5 ? '#fff' : '#ffe66d'); }
  put(customerSprite('cat', Math.ceil(S * 0.36)), cx - S * 0.66, cy + S * 0.5, S * 0.36, -0.12);
}
function title(cx, cy, size) {
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
  const line = (s, y, sz, fillStops) => {
    g.font = `900 ${sz}px ${FONT}`;
    g.lineWidth = sz * 0.3; g.strokeStyle = OUT; g.strokeText(s, cx, y + sz * 0.06);
    g.strokeText(s, cx, y);
    g.lineWidth = sz * 0.1; g.strokeStyle = '#fff'; g.strokeText(s, cx, y);
    g.fillStyle = lg(g, 0, y - sz / 2, 0, y + sz / 2, fillStops); g.fillText(s, cx, y);
  };
  line('Magic Attic', cy - size * 0.42, size, [[0, '#fff3a0'], [1, '#ff9f1c']]);
  // MERGE ribbon
  g.font = `900 ${size * 0.62}px ${FONT}`; const rw = g.measureText('HIDDEN OBJECTS').width + size * 0.6, rh = size * 0.9, ry = cy + size * 0.55;
  g.save();
  g.beginPath();
  g.moveTo(cx - rw / 2 - rh * 0.4, ry - rh / 2); g.lineTo(cx + rw / 2 + rh * 0.4, ry - rh / 2);
  g.lineTo(cx + rw / 2, ry); g.lineTo(cx + rw / 2 + rh * 0.4, ry + rh / 2);
  g.lineTo(cx - rw / 2 - rh * 0.4, ry + rh / 2); g.lineTo(cx - rw / 2, ry); g.closePath();
  g.fillStyle = lg(g, 0, ry - rh / 2, 0, ry + rh / 2, [[0, '#ff9ad0'], [1, '#d8388a']]); g.fill();
  g.lineWidth = size * 0.08; g.strokeStyle = OUT; g.stroke();
  g.restore();
  g.font = `900 ${size * 0.62}px ${FONT}`;
  g.lineWidth = size * 0.16; g.strokeStyle = OUT; g.strokeText('HIDDEN OBJECTS', cx, ry + size * 0.03);
  g.fillStyle = '#fff'; g.fillText('HIDDEN OBJECTS', cx, ry + size * 0.03);
  }

roomBg();
const ar = W / H, u = Math.min(W, H);
// scene occupies ~1.8S wide x 1.5S tall around its centre (centre sits 0.8S below the box top)
const fit = (x0, y0, w, h) => { const S = Math.min(w / 1.8, h / 1.5); scene(x0 + w / 2, y0 + (h - 1.5 * S) / 2 + 0.82 * S, S); };
if (!TITLE) {
  fit(0, H * 0.03, W, H * 0.97);
} else if (ar > 1.6) {            // wide: title left, scene right
  fit(W * 0.42, H * 0.02, W * 0.58, H * 0.98);
  title(W * 0.235, H * 0.46, Math.min(W * 0.058, H * 0.16));
} else if (ar > 0.85) {           // square / 4:3: scene top, title bottom (portals put "New"/"Hot" badges top-left)
  fit(0, H * 0.02, W, H * 0.66);
  title(W / 2, H * 0.83, Math.min(u * 0.105, W * 0.1));
} else {                          // portrait: title kept below the top-left badge zone
  scene(W / 2, H * 0.68, W * 0.6);
  title(W / 2, H * 0.2, W * 0.13);
}
document.title = 'done';
</script></body></html>
